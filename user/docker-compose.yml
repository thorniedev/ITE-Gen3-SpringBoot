services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: oauth2
    command:
      - start-dev
    env_file:
      - ../.env
    environment:
      #Connect to your EXISTING "iam" database
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://host.docker.internal:5850/iam}
      KC_DB_USERNAME: ${DB_USER:-admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-admin@123}

      # Bootstrap admin (created only on first boot if iam is empty)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-iam@123}

      # Theme dev — disable caching so changes show on restart
      KC_SPI_THEME_STATIC_MAX_AGE: -1
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"

    ports:
      - "127.0.0.1:9090:8080"

    volumes:
      - ./keycloak/themes:/opt/keycloak/themes

    restart: always
