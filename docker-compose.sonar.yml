services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      # From inside Docker, use host.docker.internal to reach PostgreSQL on your Mac.
      SONAR_JDBC_URL: ${SONAR_JDBC_URL:-jdbc:postgresql://host.docker.internal:5850/sonarqube}
      SONAR_JDBC_USERNAME: ${DB_USER:-admin}
      SONAR_JDBC_PASSWORD: ${DB_PASSWORD:-admin@123}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
