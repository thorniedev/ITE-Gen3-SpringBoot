name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ite-gen3-springboot-ecommerce
  JAVA_VERSION: "25"

jobs:
  build:
    name: Build Ecommerce Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build boot jar
        run: ./gradlew clean :ecommerce:bootJar -x test --no-daemon

      - name: Upload boot jar
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-boot-jar
          path: ecommerce/build/libs/*.jar
          if-no-files-found: error

  container:
    name: Publish Container Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build container image
        env:
          BP_JVM_VERSION: ${{ env.JAVA_VERSION }}
        run: ./gradlew :ecommerce:bootBuildImage --imageName="${IMAGE_NAME}:${GITHUB_SHA}" --no-daemon

      - name: Push image tags
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

  deploy:
    name: Deploy With Docker Compose
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip deploy when server secrets are missing
        if: env.DEPLOY_HOST == ''
        run: echo "Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and optional DEPLOY_PATH secrets to enable deployment."

      - name: Configure SSH
        if: env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        if: env.DEPLOY_HOST != ''
        run: |
          REMOTE_PATH="${DEPLOY_PATH:-/home/${DEPLOY_USER}/app/ite-spring-boot}"
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}/docker-compose.prod.yml"

      - name: Pull and restart services
        if: env.DEPLOY_HOST != ''
        run: |
          REMOTE_PATH="${DEPLOY_PATH:-/home/${DEPLOY_USER}/app/ite-spring-boot}"
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "
            cd ${REMOTE_PATH} &&
            ECOMMERCE_IMAGE=${IMAGE_NAME}:${GITHUB_SHA} docker compose -f docker-compose.prod.yml pull ecommerce &&
            ECOMMERCE_IMAGE=${IMAGE_NAME}:${GITHUB_SHA} docker compose -f docker-compose.prod.yml up -d
          "
